version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: roomtrace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: roomtrace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: roomtrace-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: roomtrace-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: roomtrace-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/roomtrace?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: "http://minio:9000"
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadminpassword
    ports:
      - "4000:4000"

  web:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
    container_name: roomtrace-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api/v1"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
